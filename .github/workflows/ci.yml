# Continuous Integration workflow for zen-linear
# Runs on pushes to main and non-draft pull requests

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review is required so marking a draft PR ready triggers a run;
    # the default types (opened, synchronize, reopened) don't fire on that
    # transition. Draft PRs still emit these events — the job-level `if` below
    # is what actually skips them.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  # The action is part of the key so a `ready_for_review` run can't be cancelled
  # by a `synchronize` run that raced it. Pushing and marking ready in one go
  # sends both at once: synchronize still carries `draft: true`, so its jobs
  # skip, and if it also cancelled the ready run the PR ended up with no CI at
  # all while reporting only skipped checks. Successive pushes share the
  # `synchronize` key and still supersede each other, which is the case
  # cancel-in-progress is actually for.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing in CI writes. Without this every job takes the default token scope,
# which CodeQL flags per job (actions/missing-workflow-permissions) and which is
# more than a checkout, a build and a test need. release.yml has always said so;
# this file never did.
permissions:
  contents: read

jobs:
  lint:
    name: Lint + Format
    # Skip while the PR is a draft; push events (main) have no PR object and
    # always run. Marking the PR ready (ready_for_review) re-fires CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # Deliberately NOT a matrix with the Windows leg below. "Test" is a required
  # status check on main, and a matrix renames it to "Test (ubuntu-latest)",
  # which the rule would then wait forever for. Renaming a required check is a
  # repo-settings change, not a workflow one.
  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  # Nothing had ever executed this code on Windows. The race detector stays on
  # the Linux leg, which needs a C toolchain, and coverage is uploaded once
  # rather than raced between the two.
  test-windows:
    name: Test (windows)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -v ./cmd/zen-linear

  install-script:
    name: Install script (${{ matrix.shell }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.1 is what ships with Windows and what `irm | iex` reaches by
        # default, and it is the one with the TLS 1.2 default this script works
        # around. 7 is what a developer is likely to have. Both have to work.
        shell: [powershell, pwsh]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Against the published release rather than this branch's build: what is
      # being tested is the download, the checksum match, the extraction and the
      # move, none of which a local binary exercises.
      #
      # `shell:` takes no matrix context, so the shell under test is launched as
      # a child of the runner's default one rather than named as the step's own.
      - name: Install the latest release
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./install.ps1

      # Assertions only, so this runs in the default shell whichever leg it is.
      - name: Check it runs and reports a released version
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\zen-linear\zen-linear.exe'
          if (-not (Test-Path $exe)) { throw "the installer left no binary at $exe" }
          $reported = & $exe --version
          Write-Host $reported
          # "dev" is what a local build reports, so seeing it here means the
          # installer ran something other than the release it downloaded.
          if ($reported -match 'zen-linear dev') { throw "installed binary reports dev: $reported" }
          if ($reported -notmatch 'zen-linear \d+\.\d+\.\d+') { throw "unexpected version line: $reported" }

      # An upgrade over an existing binary is the case Windows makes awkward,
      # and the one a second run covers. Piped rather than run as a file,
      # because `irm | iex` is what the docs tell people to run and it is a
      # different execution path from -File.
      - name: Install again, the way the docs say to run it
        run: ${{ matrix.shell }} -NoProfile -Command "Get-Content ./install.ps1 -Raw | Invoke-Expression"
