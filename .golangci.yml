# golangci-lint configuration for zen-linear
# Documentation: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional linters
    - bodyclose
    - dogsled
    - dupl
    - errorlint
    - gocritic
    # goconst is off on purpose. "project" here is a favorite type, a picker
    # item id, a search keyword, a Linear grouping value, and a group-by
    # dimension; goconst reads the five as one string and points at
    # GroupByProject. Where it does find a real repeat, the constant it wants
    # is an untyped string passed to a plain string parameter, so naming the
    # literal buys no compile-time check. config.validate* guards the boundary.
    - gocyclo
    - misspell
    - nakedret
    - nolintlint
    - revive
    - rowserrcheck
    - unconvert
    - unparam
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false  # Don't check _ = errors

    govet:
      enable-all: true
      disable:
        - fieldalignment  # Too pedantic for this project

    gocyclo:
      min-complexity: 40

    dupl:
      threshold: 100

    misspell:
      locale: US

    nakedret:
      max-func-lines: 100

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - gocyclo
          - goconst
          - errcheck
          - govet
          - unparam

      # Exclude shadow checking on err
      - text: 'shadow: declaration of "err"'
        linters:
          - govet

      # theme.go's parallel per-theme tables should stay parallel, not be
      # collapsed to satisfy dupl.
      - path: internal/tui/theme\.go
        linters:
          - dupl

      # Parallel GraphQL wrappers: shurcooL needs a distinct struct and tag per
      # mutation/query, so these single-field delete/archive/list methods read as
      # duplicates but cannot share one selection.
      - path: internal/linearapi/(favorites|teams|metadata|issue_mutations)\.go
        linters:
          - dupl

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
