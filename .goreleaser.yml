# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for zen-linear
# Documentation: https://goreleaser.com

version: 2

project_name: zen-linear

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy

builds:
  - id: zen-linear
    main: ./cmd/zen-linear
    binary: zen-linear
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Skip Windows ARM64 (not commonly needed)
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    # Use zip for Windows
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: praxis-labs-io
    name: zen-linear
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
